apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploywatch
  labels:
    app: deploywatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploywatch
  template:
    metadata:
      labels:
        app: deploywatch
    spec:
      containers:
        - name: deploywatch
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/deploywatch:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: APP_ENV
              value: production
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
