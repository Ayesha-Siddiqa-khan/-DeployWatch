apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deploywatch
  labels:
    app: deploywatch
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - deploywatch.example.com
      secretName: deploywatch-tls
  rules:
    - host: deploywatch.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deploywatch
                port:
                  number: 80
